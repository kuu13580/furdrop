name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-workers:
    name: Workers デプロイ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 設定ファイル生成 (本番)
        run: pnpm generate:prod
        env:
          DOTENV_PRIVATE_KEY_PROD: ${{ secrets.DOTENV_PRIVATE_KEY_PROD }}

      - name: D1 マイグレーション
        run: pnpm --filter workers migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Workers シークレット投入 (R2クレデンシャル)
        run: pnpm secrets:prod
        env:
          DOTENV_PRIVATE_KEY_PROD: ${{ secrets.DOTENV_PRIVATE_KEY_PROD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: R2バケットCORS設定適用
        run: pnpm cors:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Workers デプロイ
        run: pnpm --filter workers exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Pages デプロイ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 設定ファイル生成 (本番)
        run: pnpm generate:prod
        env:
          DOTENV_PRIVATE_KEY_PROD: ${{ secrets.DOTENV_PRIVATE_KEY_PROD }}

      - name: ビルド
        run: pnpm --filter frontend build

      # wrangler pages deploy はCI環境のgitから自動でcommit_messageを抽出するが、
      # squash merge後の本文 (複数サブコミットを含む長文) を渡すとCloudflare Pages APIに
      # `Invalid commit message` (8000111) で拒否されることがある。subject行のみを明示渡しする。
      - name: Pages デプロイ
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 500)
          pnpm --filter workers exec wrangler pages deploy ../frontend/dist \
            --project-name=furdrop \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$COMMIT_MSG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
