name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint・型チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint + Format チェック
        run: pnpm check

      - name: 型チェック
        run: pnpm typecheck

  test-frontend:
    name: Frontend ユニットテスト (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: frontend テスト
        run: pnpm --filter frontend test

  test-workers:
    name: Workers 統合テスト (vitest-pool-workers + Auth Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # Firebase Auth Emulator (firebase-tools) は JRE 17+ 必須
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pnpm install --frozen-lockfile

      - name: Workers テスト (firebase emulators:exec で包む)
        run: pnpm exec firebase emulators:exec --only auth --project demo-furdrop "pnpm --filter workers test"

  test-e2e:
    name: Playwright E2E (Frontend + Workers + Auth Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pnpm install --frozen-lockfile

      - name: Playwright ブラウザ install
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E (firebase emulators:exec で包む)
        run: pnpm exec firebase emulators:exec --only auth --project demo-furdrop "pnpm --filter e2e test"

      - name: Playwright report をアップロード (失敗時のみ)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
